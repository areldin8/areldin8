<svg fill="none" viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .sims-container {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: #102538;
          border: 4px solid #00bcff;
          border-radius: 12px;
          padding: 25px;
          color: #ffffff;
          box-shadow: 0 8px 24px rgba(0,0,0,0.5);
          display: flex;
          gap: 25px;
          height: 390px;
        }
        .left-panel {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(0,0,0,0.3);
          border-radius: 8px;
          padding: 15px;
          position: relative;
        }
        /* Тот самый зеленый ромб Симс сверху */
        .plumbob {
          width: 0;
          height: 0;
          border-left: 20px solid transparent;
          border-right: 20px solid transparent;
          border-bottom: 35px solid #36ff00;
          position: absolute;
          top: -15px;
          filter: drop-shadow(0 0 8px #36ff00);
          animation: float 3s ease-in-out infinite;
        }
        .plumbob:after {
          content: '';
          width: 0;
          height: 0;
          border-left: 20px solid transparent;
          border-right: 20px solid transparent;
          border-top: 35px solid #36ff00;
          position: absolute;
          top: 35px;
          left: -20px;
        }
        .avatar-placeholder {
          font-size: 50px;
          margin-top: 40px;
        }
        .sim-name {
          font-size: 24px;
          font-weight: bold;
          color: #00bcff;
          margin-top: 15px;
          text-shadow: 2px 2px #000;
        }
        .sim-title {
          font-size: 14px;
          color: #a0c0d0;
        }
        .right-panel {
          flex: 2;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .section-title {
          font-size: 16px;
          text-transform: uppercase;
          letter-spacing: 1px;
          color: #36ff00;
          border-bottom: 2px solid rgba(255,255,255,0.1);
          padding-bottom: 5px;
          margin: 0;
        }
        /* Шкалы потребностей (Needs) из Симс */
        .need-bar-container {
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: rgba(0,0,0,0.4);
          padding: 6px 12px;
          border-radius: 6px;
          border: 1px solid rgba(255,255,255,0.05);
        }
        .need-name {
          font-size: 14px;
          width: 120px;
          font-weight: 600;
        }
        .track {
          flex-grow: 1;
          background: #444;
          height: 14px;
          border-radius: 7px;
          overflow: hidden;
          border: 1px solid #111;
          position: relative;
        }
        .fill-green {
          background: linear-gradient(90deg, #15aa00, #36ff00);
          height: 100%;
          border-radius: 7px;
        }
        .fill-full { width: 100%; }
        .fill-high { width: 85%; }
        .fill-med { width: 75%; }
        
        @keyframes float {
          0% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-10px) rotate(5deg); }
          100% { transform: translateY(0px) rotate(0deg); }
        }
      </style>

      <div class="sims-container">
        <div class="left-panel">
          <div class="plumbob"></div>
          <div class="avatar-placeholder">👩‍💻</div>
          <div class="sim-name">Надежда</div>
          <div class="sim-title">Java Backend Developer</div>
        </div>
        
        <div class="right-panel">
          <h3 class="section-title">Текущие потребности (Стек &amp; Навыки)</h3>
          
          <div class="need-bar-container">
            <span class="need-name">Java / Spring Boot</span>
            <div class="track"><div class="fill-green fill-full"></div></div>
          </div>
          
          <div class="need-bar-container">
            <span class="need-name">PostgreSQL / SQL</span>
            <div class="track"><div class="fill-green fill-high"></div></div>
          </div>
          
          <div class="need-bar-container">
            <span class="need-name">Docker / DevOps</span>
            <div class="track"><div class="fill-green fill-med"></div></div>
          </div>

          <div class="need-bar-container">
            <span class="need-name">Apache Kafka</span>
            <div class="track"><div class="fill-green fill-med"></div></div>
          </div>

          <h3 class="section-title">Черты характера (Опыт)</h3>
          <div style="display: flex; gap: 10px; font-size: 13px; margin-top: 5px;">
            <span style="background: #00bcff; padding: 4px 10px; border-radius: 20px; font-weight: bold; box-shadow: 1px 1px 3px #000;">Задрот (Код от руки и немного ии-агентов)</span>
            <span style="background: #36ff00; padding: 4px 10px; border-radius: 20px; color: #000; font-weight: bold; box-shadow: 1px 1px 3px #000;">Немного баз данных(косвенное IT) (Highload)</span>
            <span style="background: #ffaa00; padding: 4px 10px; border-radius: 20px; color: #000; font-weight: bold; box-shadow: 1px 1px 3px #000;">Git, wsl, docker(базовый минимум)</span>
            
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
